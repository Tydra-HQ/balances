name: Update data and publish

# Runs on every push to main, on the 3rd of each month, and on demand (Actions tab > Run workflow).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Restore downloaded filings
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: filings-${{ github.run_id }}
          restore-keys: filings-

      - name: Build report data from the ESEF filings
        run: python pipeline/build.py

      - name: Save updated data to the repository
        run: |
          git config user.name "balances-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data pipeline/concepts
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update report data"
            git push
          fi

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js sw.js manifest.webmanifest icon-192.png icon-512.png _site/
          cp -r data _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
